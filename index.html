<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Service Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes Service</h1>
    <p>Manage your notes securely via the REST API.</p>
  </header>

  <main>
    <!-- Note Creation Form (Ready for Task 2) -->
    <section class="card">
      <h2>Create New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (Required, max 100 characters):</label>
          <input type="text" id="title-input" maxlength="100" placeholder="Note title..." required>
        </div>
        
        <div class="form-group">
          <label for="body-input">Body (Optional):</label>
          <textarea id="body-input" rows="4" placeholder="Write your note content here..."></textarea>
        </div>

        <button id="submit-btn" type="submit">Create Note</button>
      </form>
    </section>

    <!-- Notes Explorer -->
    <section class="card">
      <div class="actions-bar">
        <h2>Saved Notes</h2>
        <button id="load-btn" type="button">Load Notes</button>
      </div>

      <p id="status">Click "Load Notes" to fetch items from the server.</p>

      <ul id="notes-list">
        <!-- Notes will appear here -->
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes System Design Capstone</p>
  </footer>
</body>
</html>
